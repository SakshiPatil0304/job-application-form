<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Job Application Form</h1>
        <p>Apply for your dream job</p>
    </header>

    <hr>

    <main>

        <form action="success.html" id="jobForm">

            <h2>Personal Information</h2>

            <label>Name:</label>
            <input type="text" id="fullName" placeholder="Enter your name" required>
            <span class="error" id="nameError"></span>
            <br><br>

            <label>Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <span class="error" id="emailError"></span>
 
            <br><br>

            <label>Phone:</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>
            <span class="error" id="phoneError"></span>

            <br><br>

            <h2>Job Information</h2>

            <label>Position:</label>

            <select id="position"  required>
                <option>Java Developer</option>
                <option>Frontend Developer</option>
                <option>Backend Developer</option>
                <option>Full Stack Developer</option>
            </select>

            <br><br>

            <label>Experience:</label>

            <select id="experience" required>
                <option>Fresher</option>
                <option>1-2 Years</option>
                <option>2-5 Years</option>
                <option>5+ Years</option>
            </select>

            <br><br>

            <label>Skills:</label>
            <br>

            <input type="checkbox" class="skill"> Java
            <input type="checkbox" class="skill"> HTML
            <input type="checkbox" class="skill"> CSS
            <input type="checkbox" class="skill"> JavaScript
            <input type="checkbox" class="skill"> Spring Boot
            <input type="checkbox" class="skill"> MySQL
            
            <span class="error" id="skillsError"></span>

            <br><br>

            <h2>Resume</h2>

            <input type="file" id="resume" required>
            <span class="error" id="resumeError"></span>

            <br><br>

            <label>Why should we hire you?</label>
            <br>

            <textarea id="message" rows="5" cols="40" required></textarea>
            <span class="error" id="messageError"></span>

            <br><br>

            <input type="checkbox" id="term" required>
            I agree to the terms and conditions.

            <span class="error" id="termsError"></span>

            <br><br>

            <button type="submit">Apply Now</button>

        </form>

    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Job Application Form</p>
        <p>Created by Sakshi Patil</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
